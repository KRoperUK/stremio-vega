# Single service: the Node streaming server serves the built web app AND the
# codec-aware /api (probe / stream / addon proxy). ffmpeg is baked into the
# image. Fronted by the host's reverse proxy / tunnel over HTTPS.
services:
  app:
    build:
      # Komodo runs `docker compose -f deploy/docker-compose.yml` with its CWD
      # set to this file's directory (deploy/), so paths here are relative to
      # deploy/. The build needs the repo root (to COPY app/ and server/), so
      # context is the parent and the Dockerfile path is relative to it.
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: stremio-vega-web
    restart: unless-stopped
    environment:
      PORT: "8080"
      # Secret token gating /api. The app reads it from the server-injected
      # index.html, so only a client that reached this origin gets it.
      SERVER_TOKEN: ${SERVER_TOKEN:?SERVER_TOKEN is required}
      # Software transcode tuning for the GPU-less ARM VPS.
      X264_PRESET: ${X264_PRESET:-veryfast}
      X264_CRF: ${X264_CRF:-23}
      MAX_BITRATE: ${MAX_BITRATE:-8M}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks:
      - edge

networks:
  # Joined, not created: the host's reverse-proxy / tunnel stack owns this and
  # reaches the container by its container_name. Default matches a standard
  # cloudflared compose stack; override with EDGE_NETWORK.
  edge:
    external: true
    name: ${EDGE_NETWORK:-cloudflared_cloudflared}
